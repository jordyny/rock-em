name: AWS OIDC + SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::739147175766:role/rockem-github-deploy
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create test artifact
        run: |
          echo "hello from GitHub Actions" > test-artifact.txt

      - name: Upload test artifact
        run: |
          aws s3 cp test-artifact.txt \
            s3://rockem-deployments-739147175766/releases/test-artifact.txt

      - name: Send test command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a1fa506d610e83ed" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["whoami","hostname","pwd"]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait for command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0a1fa506d610e83ed"

      - name: Show command result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0a1fa506d610e83ed"
