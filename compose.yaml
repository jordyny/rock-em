services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rockem
      POSTGRES_USER: rockem
      POSTGRES_PASSWORD: rockem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockem -d rockem"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
